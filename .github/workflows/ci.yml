name: CI

# Corre los 19 tests reales del proyecto en cada push/PR a main -- antes solo
# se corrían si alguien se acordaba de invocarlos a mano. windows-latest porque
# el proyecto es intrínsecamente Windows (WPF, WebView2, SQL Server) y algunas
# dependencias committeadas (node_modules, ml-service/.venv) son específicas
# de Windows; correr en Linux rompería con esas rutas de todos modos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # TranscribeEndpointTests spawnea un proceso Python real. El ml-service/.venv
      # committeado NO sirve aquí -- su pyvenv.cfg graba la ruta absoluta del Python
      # de la máquina original (C:\Users\...\Python312), que no existe en este runner,
      # así que el intérprete ni arranca (falla antes de llegar al import que el test
      # espera). Se le da a la API un Python real vía las mismas PYTHON_EXE/SCRIPTS_DIR
      # que ya soporta para la app instalada -- sin faster-whisper instalado, que es
      # justo el escenario que el test fija a propósito.
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: dotnet test (api.Tests -- SQLite temporal, no necesita SQL Server)
        run: dotnet test api.Tests --configuration Release
        env:
          PYTHON_EXE: ${{ steps.py.outputs.python-path }}
          SCRIPTS_DIR: ${{ github.workspace }}\ml-service\data

  web-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Type-check (tsc --noEmit)
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint (eslint)
        working-directory: web
        run: npx eslint app

  ml-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias (requirements.txt + requirements-dev.txt)
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest
        working-directory: ml-service
        run: python -m pytest tests/ -v
